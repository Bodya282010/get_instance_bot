name: Retry create instance

on:
  workflow_dispatch:

jobs:
  retry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRONJOB_JOBID: ${{ secrets.CRONJOB_JOBID }}
          AVAILABILITY_DOMAIN: ${{ secrets.AVAILABILITY_DOMAIN }}
          CREATE_VNIC_DETAILS_SUBNET_ID: ${{ secrets.CREATE_VNIC_DETAILS_SUBNET_ID }}
          DISPLAY_NAME: ${{ secrets.DISPLAY_NAME }}
          SHAPE: ${{ secrets.SHAPE }}
          SHAPE_CONFIG_MEMORY_IN_GBS: ${{ vars.SHAPE_CONFIG_MEMORY_IN_GBS }}
          SHAPE_CONFIG_OCPUS: ${{ vars.SHAPE_CONFIG_OCPUS }}
          SOURCE_DETAILS_BOOT_VOLUME_SIZE_IN_GBS: ${{ vars.SOURCE_DETAILS_BOOT_VOLUME_SIZE_IN_GBS }}
          SOURCE_DETAILS_IMAGE_ID: ${{ secrets.SOURCE_DETAILS_IMAGE_ID }}
        run: python create_instance_ga.py
